<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous">
    </script>
    <title>Calculator</title>
</head>
<body>
    <div class="calculator-wrapper">
        <div>
            <span></span>
            <span></span>
            <span></span>
        </div>
        <div>
            <p class="input-calc"> 
                <!-- 2 <span>&#xd7;</span> 10 <span>&#xd7;</span> 5 <span>&#x2b</span> 700 -->
            </p>
            <span class="separator"></span>
            <h1 class="result-field"></h1>
        </div>
        <div class="container-calculator">
            <button value="clear" id="clear">
                C
            </button>
            <button value="+/-">
                +/-
            </button>
            <button value="%" id="modulus">
                %
            </button>          
            <button value="/" class="operator-btn">
              &#xf7
            </button>
            <button value="7" id="7" class="num-btn">
                7
            </button>
            <button value="8" id="8" class="num-btn">
                8
            </button>
            <button value="9" id="9" class="num-btn">
                9
            </button>          
            <button value="*" id="multiply" class="operator-btn">
              &#xd7
            </button> 
            <button value="4" id="4" class="num-btn">
                4
            </button>
            <button value="5" id="5" class="num-btn">
                5
            </button>
            <button value="6" id="6" class="num-btn">
                6
            </button>          
            <button value="-" id="minus" class="operator-btn">
             &#x2212;
            </button>
            <button value="1" id="1" class="num-btn">
                1
            </button>
            <button value="2" id="2" class="num-btn">
                2
            </button>
            <button value="3" id="3" class="num-btn">
                3
            </button>          
            <button value="+" id="plus" class="operator-btn">
                &#x2b;
            </button>           
        </div>
        <div class="container-result">
                <button value="0" id="zero" class="num-btn">
                    0
                </button>
                <button value="," id="coma">
                    ,
                </button>
                <button value="=" id="result">
                    =
                </button>
        </div>
    </div>
    <script src="main.js"></script>
</body>
</html>
