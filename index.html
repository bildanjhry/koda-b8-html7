<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="index.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
</head>
<body>
    <div class="calculator-wrapper">
        <div>
            <span></span>
            <span></span>
            <span></span>
        </div>
        <div>
            <p> 
                2 <span>&#xd7;</span> 10 <span>&#xd7;</span> 5 <span>&#x2b</span> 700
            </p>
            <span class="separator"></span>
            <h1>1.700</h1>
        </div>
        <div class="container-calculator">
            <button>
                C
            </button>
            <button>
                +/-
            </button>
            <button>
                %
            </button>          
            <button>
              &#xf7;
            </button>
            <button>
                7
            </button>
            <button>
                8
            </button>
            <button>
                9
            </button>          
            <button>
              &#xd7
            </button> 
            <button>
                4
            </button>
            <button>
                5
            </button>
            <button>
                6
            </button>          
            <button>
             &#x2212;
            </button>
            <button>
                1
            </button>
            <button>
                2
            </button>
            <button>
                3
            </button>          
            <button>
                &#x2b;
            </button>           
        </div>
        <div class="container-result">
                <button>
                    0
                </button>
                <button>
                    ,
                </button>
                <button>
                    =
                </button>
            </div>
        </div>
    </div>
</body>
</html>
